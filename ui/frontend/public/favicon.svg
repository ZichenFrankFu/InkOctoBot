<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Head -->
  <ellipse cx="32" cy="22" rx="18" ry="16" fill="url(#g)"/>
  <!-- Eyes -->
  <ellipse cx="25" cy="20" rx="4" ry="4.5" fill="#fff"/>
  <ellipse cx="39" cy="20" rx="4" ry="4.5" fill="#fff"/>
  <circle cx="26" cy="20" r="2" fill="#1e1b4b"/>
  <circle cx="40" cy="20" r="2" fill="#1e1b4b"/>
  <!-- Tentacles (8 legs, curving outward) -->
  <path d="M14 34 Q6 46 10 56" stroke="#6366f1" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M18 36 Q12 50 16 58" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M24 37 Q20 52 20 60" stroke="#6366f1" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M30 38 Q28 54 30 62" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M36 38 Q38 54 36 62" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M42 37 Q46 52 44 60" stroke="#6366f1" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M48 36 Q54 50 50 58" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M52 34 Q60 46 56 56" stroke="#6366f1" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Ink pen (held by right tentacle) -->
  <g transform="rotate(30 50 28)">
    <rect x="48" y="10" width="3.5" height="16" rx="1.2" fill="#f59e0b"/>
    <rect x="48.5" y="8" width="2.5" height="4" rx="1" fill="#fbbf24"/>
    <polygon points="48,26 51.5,26 49.75,31" fill="#1e1b4b"/>
  </g>
  <!-- Small ink drops -->
  <circle cx="56" cy="46" r="1.5" fill="#6366f1" opacity="0.5"/>
  <circle cx="53" cy="50" r="1" fill="#8b5cf6" opacity="0.4"/>
</svg>
