<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="inkHead" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#4a4a6a"/>
      <stop offset="70%" stop-color="#2d2d44"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
    <radialGradient id="inkDrop" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#3d3d5c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <!-- Ink wash background splash -->
  <circle cx="32" cy="30" r="28" fill="#1a1a2e" opacity="0.06"/>
  <ellipse cx="30" cy="32" rx="24" ry="20" fill="#2d2d44" opacity="0.05"/>
  <!-- Head - ink wash style with soft edges -->
  <ellipse cx="32" cy="22" rx="17" ry="15" fill="url(#inkHead)" opacity="0.92"/>
  <ellipse cx="32" cy="20" rx="14" ry="11" fill="#3d3d5c" opacity="0.3"/>
  <!-- Eyes - brush stroke style -->
  <ellipse cx="25" cy="20" rx="3.8" ry="4.2" fill="#e8e4df"/>
  <ellipse cx="39" cy="20" rx="3.8" ry="4.2" fill="#e8e4df"/>
  <circle cx="26" cy="20" r="1.8" fill="#1a1a2e"/>
  <circle cx="40" cy="20" r="1.8" fill="#1a1a2e"/>
  <circle cx="26.5" cy="19.5" r="0.6" fill="#e8e4df"/>
  <circle cx="40.5" cy="19.5" r="0.6" fill="#e8e4df"/>
  <!-- Tentacles - ink brush strokes with varying opacity -->
  <path d="M14 33 Q5 46 9 57" stroke="#2d2d44" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M18 35 Q10 50 15 59" stroke="#3d3d5c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M24 37 Q19 52 18 61" stroke="#2d2d44" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M30 38 Q27 54 29 62" stroke="#4a4a6a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M36 38 Q39 54 37 62" stroke="#4a4a6a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M42 37 Q47 52 46 61" stroke="#2d2d44" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M48 35 Q56 50 51 59" stroke="#3d3d5c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M52 33 Q61 46 57 57" stroke="#2d2d44" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- Ink brush pen (毛笔) held by right tentacle -->
  <g transform="rotate(25 52 32)">
    <!-- Brush handle - bamboo color -->
    <rect x="50" y="10" width="3" height="18" rx="1.5" fill="#8B7355" opacity="0.9"/>
    <rect x="50.3" y="10" width="0.8" height="18" rx="0.4" fill="#a08c6a" opacity="0.4"/>
    <!-- Brush tip - ink soaked -->
    <path d="M50 28 Q51.5 34 53 28" fill="#1a1a2e" opacity="0.9"/>
    <path d="M50.5 28 Q51.5 32 52.5 28" fill="#2d2d44" opacity="0.6"/>
  </g>
  <!-- Ink splatter effects -->
  <circle cx="58" cy="44" r="2" fill="url(#inkDrop)"/>
  <circle cx="55" cy="49" r="1.2" fill="#2d2d44" opacity="0.35"/>
  <circle cx="60" cy="47" r="0.8" fill="#1a1a2e" opacity="0.25"/>
  <circle cx="6" cy="52" r="1.5" fill="#2d2d44" opacity="0.2"/>
  <circle cx="10" cy="56" r="0.7" fill="#1a1a2e" opacity="0.15"/>
</svg>
