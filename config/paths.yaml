 
# 路径配置 — 所有路径相对于项目根目录（BASE_DIR）
# PyInstaller 打包态下 BASE_DIR 会自动切换到 LOCALAPPDATA/InkOctoBot

database:
  path: "data/novels.db"

crawler_database:
  path: "data/InkOctoBot_Crawler.db"

output_paths:
  data_raw: "outputs/data/raw"
  logs: "outputs/logs"
  reports: "outputs/reports"
  visualizations: "outputs/reports/visualizations"
