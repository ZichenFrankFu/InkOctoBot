proxy:
  enabled: true
  type: file
  path: proxies.txt
  rotate_after: 10
  timeout: 10

user_agent:
  enabled: true
  rotate_after: 5

throttler:
  min_delay: 1.5
  max_delay: 3.5
  random_factor: 0.3
  burst_detection: true
  burst_threshold: 5
  burst_cooldown: 15.0

block_detector:
  enabled: true
  block_keywords:
    - 验证码
    - 访问频繁
    - 禁止访问
    - "403"
    - "404"
    - 出错了
    - 访问受限
    - 安全验证
  status_codes: [403, 429, 503, 418]
  retry_on_block: true
  max_block_retries: 5
  cooldown_on_block: 30.0
