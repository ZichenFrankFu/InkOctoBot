# Model routing configuration
# Each agent role can be assigned a specific provider + model

default_provider: ollama
default_model: "qwen2.5:14b"

role_overrides:
  # Planning agents — benefit from stronger models
  scene_director:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.6
    max_tokens: 4000

  story_architect:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.5
    max_tokens: 6000

  # Production agents
  actor_agent:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.8
    max_tokens: 3000

  narrator_agent:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.8
    max_tokens: 2000

  editor_writer:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.7
    max_tokens: 8000

  # Evaluation — lower temperature for precision
  evaluator:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.3
    max_tokens: 4000

  edit_analyzer:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.3
    max_tokens: 3000

  # Memory consolidation
  consolidator:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.3
    max_tokens: 2000

  # Disambiguation
  disambiguator:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.5
    max_tokens: 2000

  # Novel skill extraction — chapter-level (local model, high throughput)
  chapter_extractor:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.3
    max_tokens: 4096

  # Novel skill extraction — novel-level aggregation (cloud model, long context)
  novel_aggregator:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.3
    max_tokens: 8192

  # Novel skill extraction — cross-novel pattern mining (cloud model)
  pattern_miner:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.4
    max_tokens: 8192

  # Reference works — segmented feature extraction
  # (characters / settings / narrative / rhythm, NLP fallback).
  reference_extractor:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.3
    max_tokens: 4096

  # Reference works — web-search metadata completion.
  # Defaults to ollama (no web access) so the capability check returns
  # disabled until the user explicitly picks anthropic/openai in Settings.
  reference_web_search:
    provider: ollama
    model: "qwen2.5:14b"
    temperature: 0.2
    max_tokens: 2048
