    阅读榜科幻末世: { rank_family: "阅读榜", rank_sub_cat: "科幻末世" }
    阅读榜都市高武: { rank_family: "阅读榜", rank_sub_cat: "都市高武" }
    阅读榜悬疑脑洞: { rank_family: "阅读榜", rank_sub_cat: "悬疑脑洞" }
    阅读榜都市脑洞: { rank_family: "阅读榜", rank_sub_cat: "都市脑洞" }
