# 站点配置

qidian:
  name: "起点中文网"
  base_url: "https://www.qidian.com"
  chapter_extraction_goal: 5
  pages_per_rank: 2

  rank_urls:
    月票榜: "https://www.qidian.com/rank/yuepiao/page{page}/"
    畅销榜: "https://www.qidian.com/rank/hotsales/page{page}/"
    阅读指数榜: "https://www.qidian.com/rank/readIndex/page{page}/"
    推荐榜: "https://www.qidian.com/rank/recom/page{page}/"
    收藏榜: "https://www.qidian.com/rank/collect/page{page}/"
    签约作者新书榜: "https://www.qidian.com/rank/signnewbook/page{page}/"
    公众作者新书榜: "https://www.qidian.com/rank/pubnewbook/page{page}/"
    新人签约新书榜: "https://www.qidian.com/rank/newsign/page{page}/"
    新人作者新书榜: "https://www.qidian.com/rank/newauthor/page{page}/"

  rank_type_map:
    月票榜: { rank_family: "月票榜", rank_sub_cat: "" }
    畅销榜: { rank_family: "畅销榜", rank_sub_cat: "" }
    阅读指数榜: { rank_family: "阅读指数榜", rank_sub_cat: "" }
    推荐榜: { rank_family: "推荐榜", rank_sub_cat: "" }
    收藏榜: { rank_family: "收藏榜", rank_sub_cat: "" }
    签约作者新书榜: { rank_family: "新书榜", rank_sub_cat: "签约作者" }
    公众作者新书榜: { rank_family: "新书榜", rank_sub_cat: "公众作者" }
    新人签约新书榜: { rank_family: "新书榜", rank_sub_cat: "新人签约" }
    新人作者新书榜: { rank_family: "新书榜", rank_sub_cat: "新人作者" }

  novel_types:
    - 玄幻
    - 奇幻
    - 武侠
    - 仙侠
    - 都市
    - 现实
    - 军事
    - 历史
    - 游戏
    - 体育
    - 科幻
    - 诸天无限
    - 悬疑
    - 轻小说
    - 短篇

  sub_to_main_map:
    # 玄幻
    东方玄幻: 玄幻
    异世大陆: 玄幻
    高武世界: 玄幻
    王朝争霸: 玄幻
    # 奇幻
    剑与魔法: 奇幻
    史诗奇幻: 奇幻
    神秘幻想: 奇幻
    现代魔法: 奇幻
    历史神话: 奇幻
    另类幻想: 奇幻
    # 武侠
    传统武侠: 武侠
    武侠幻想: 武侠
    国术无双: 武侠
    古武未来: 武侠
    武侠同人: 武侠
    # 仙侠
    修真文明: 仙侠
    幻想修仙: 仙侠
    现代修真: 仙侠
    神话修真: 仙侠
    古典仙侠: 仙侠
    # 都市
    都市生活: 都市
    娱乐明星: 都市
    商战职场: 都市
    异术超能: 都市
    都市异能: 都市
    青春校园: 都市
    # 历史
    架空历史: 历史
    两宋元明: 历史
    外国历史: 历史
    上古先秦: 历史
    秦汉三国: 历史
    两晋隋唐: 历史
    五代十国: 历史
    清史民国: 历史
    历史传记: 历史
    民间传说: 历史
    # 军事
    战争幻想: 军事
    谍战特工: 军事
    军旅生涯: 军事
    抗战烽火: 军事
    军事战争: 军事
    # 悬疑
    悬疑侦探: 悬疑
    诡秘悬疑: 悬疑
    探险生存: 悬疑
    奇妙世界: 悬疑
    古今传奇: 悬疑
    # 科幻
    星际文明: 科幻
    时空穿梭: 科幻
    未来世界: 科幻
    古武机甲: 科幻
    超级科技: 科幻
    进化变异: 科幻
    末世危机: 科幻
    # 游戏
    电子竞技: 游戏
    虚拟网游: 游戏
    游戏异界: 游戏
    游戏系统: 游戏
    游戏主播: 游戏
    # 体育
    体育赛事: 体育
    篮球运动: 体育
    足球运动: 体育
    # 轻小说
    原生幻想: 轻小说
    衍生同人: 轻小说
    搞笑吐槽: 轻小说
    恋爱日常: 轻小说

  selenium_specific:
    method: dynamic
    rank_wait_css: "div.rank-list, div.rank-body, ul.rank-list, li[data-rid], body"
    detail_wait_css: ".info-label, .info-count-item, h1"
    catalog_wait_css: ".catalog-content-wrap, .volume-wrap, .catalog-content, a[href*='/chapter/']"
    page_fetch_overrides:
      page_load_sec: 10
      ready_state_sec: 8
      wait_css_sec: 8
      wait_css_required: true
      restart_driver_each_rank: false

  rank_fields_primary:
    - title
    - author
    - intro
    - main_category
    - tags

  detail_fields_primary:
    - status
    - total_words
    - total_recommend

  detail_fallback_rules:
    title: { when_empty: true }
    author: { when_empty: true }
    intro: { when_empty: true, min_len: 5 }
    main_category: { when_unknown: true }
    tags: { when_empty: true }


